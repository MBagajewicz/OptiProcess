# GPHE_ui.yaml — UI presentation metadata for Gasketed Plate Heat Exchanger
# Model-specific pages (problem_data, geometric_options, results).
# Common metadata (header, available_models, login) lives in common_ui.yaml .

model:
  display_name: "Plate Exchanger"
  icon: "fa-industry"
  sync_scalar_keys: []
  input_unit_groups:
    temperatures:
      label: "Temperatures"
      keys: [Thi, Tho, Tci, Tco]
      default_unit: degC
    flow_rates:
      label: "Flow rates"
      keys: [mh, mc]
      default_unit: kg/s
    available_pressure_drops:
      label: "Available pressure drops"
      keys: [DPhdisp, DPcdisp]
      default_unit: kPa
    densities:
      label: "Densities"
      keys: [roh, roc]
      default_unit: kg/m3
    viscosities:
      label: "Viscosities"
      keys: [mih, mic]
      default_unit: cP
    heat_capacities:
      label: "Heat capacities"
      keys: [Cph, Cpc]
      default_unit: J/kg/K
    plate_dimensions:
      label: "Plate dimensions"
      keys: [thk, bp]
      default_unit: mm

pages:
  # ============================================================
  # PROBLEM DATA PAGE
  # ============================================================
  problem_data:
    title: "Problem Data"
    default_buttons: true
    columns:
      - [optimization_target, other_options, heat_display]
      - [hot_stream, cold_stream]
      - [flow_limits]
      - [economic]

    sections:

      optimization_target:
        title: "OPTIMIZATION TARGET"
        element: radio_group
        source: "Model_Declarations"
        source_key: "Selected_OF"
        options:
          - {value: "TAC_OF", label: "TAC"}
          - {value: "CAPEX_OF", label: "CAPEX"}
          - {value: "AREA_OF", label: "AREA"}

      hot_stream:
        title: "HOT STREAM"
        element: form_group
        color: red
        source: "Model_Parameters"
        fields:
          Thi:      {label: "Inlet Temperature", unit: "°C"}
          Tho:      {label: "Outlet Temperature", unit: "°C"}
          mh:       {label: "Flow Rate", unit: "kg/s"}
          roh:      {label: "Density", unit: "kg/m³"}
          Cph:      {label: "Heat Capacity", unit: "J/(kg K)"}
          mih:      {label: "Viscosity", unit: "Pa s"}
          kh:       {label: "Thermal Cond.", unit: "W/(m K)"}
          Rfh:      {label: "Fouling Factor", unit: "m² °C/W"}
          DPhdisp:  {label: "Available Pressure Drop", unit: "Pa"}

      cold_stream:
        title: "COLD STREAM"
        element: form_group
        color: blue
        source: "Model_Parameters"
        fields:
          Tci:      {label: "Inlet Temperature", unit: "°C"}
          Tco:      {label: "Outlet Temperature", unit: "°C", computed_hint: true}
          mc:       {label: "Flow Rate", unit: "kg/s"}
          roc:      {label: "Density", unit: "kg/m³"}
          Cpc:      {label: "Heat Capacity", unit: "J/(kg K)"}
          mic:      {label: "Viscosity", unit: "Pa s"}
          kc:       {label: "Thermal Cond.", unit: "W/(m K)"}
          Rfc:      {label: "Fouling Factor", unit: "m² °C/W"}
          DPcdisp:  {label: "Available Pressure Drop", unit: "Pa"}

      heat_display:
        title: ""
        element: computed_display
        color: pink
        rows:
          - {label: "Heat Load (Calculated)", unit: "kW", computed: true}

      flow_limits:
        title: "FLOW LIMITS"
        element: limit_table
        color: red
        source: "Model_Parameters"
        rows:
          - {item: "Hot velocity", unit: "m/s", lower: vhmin, upper: vhmax}
          - {item: "Cold velocity", unit: "m/s", lower: vcmin, upper: vcmax}

      other_options:
        title: "OTHER OPTIONS"
        element: form_group
        color: gray
        source: "Model_Parameters"
        fields:
          Aexc:    {label: "Excess Area", unit: "%"}
          eta:     {label: "Pump Efficiency"}
          kplate:  {label: "Plate Thermal Conductivity", unit: "W/(m K)"}
          thk:     {label: "Plate Thickness", unit: "m"}
          phi:     {label: "Surface Enlargement Factor"}
          bp:      {label: "Plate Gap", unit: "m"}

      economic:
        title: "ECONOMIC PARAMETERS"
        element: form_group
        color: green
        source: "Model_Parameters"
        fields:
          n:        {label: "Amortization period", unit: "years"}
          pc:       {label: "Energy cost", unit: "$/kWh"}
          Nop:      {label: "Operating hours per year", unit: "h/year"}
          int_rate: {label: "Interest", unit: "%", display_factor: 100}
          par_a:    {label: "Cost model parameter a"}
          par_b:    {label: "Cost model exponent b"}

  # ============================================================
  # GEOMETRIC OPTIONS PAGE
  # ============================================================
  geometric_options:
    title: "Geometric Options"
    default_buttons: false
    columns:
      - [num_plates]
      - [plate_size]
      - [chevron_angle, hot_passes, cold_passes]

    sections:

      num_plates:
        title: "Number of Plates"
        element: checkbox_grid
        color: blue
        variable: "Ntp"

      plate_size:
        title: "Plate Size"
        element: checkbox_grid
        color: yellow
        variable: "Pl"
        value_labels:
          0: "0 (Lp=0.74, Lw=0.85, Dp=0.30)"
          1: "1 (Lp=0.98, Lw=0.81, Dp=0.29)"
          2: "2 (Lp=1.28, Lw=1.20, Dp=0.40)"
          3: "3 (Lp=1.50, Lw=1.22, Dp=0.35)"
          4: "4 (Lp=1.84, Lw=0.95, Dp=0.30)"
          5: "5 (Lp=2.09, Lw=1.20, Dp=0.40)"
          6: "6 (Lp=1.55, Lw=0.91, Dp=0.29)"
          7: "7 (Lp=0.40, Lw=0.13, Dp=0.03)"
          8: "8 (Lp=1.85, Lw=0.45, Dp=0.16)"
          9: "9 (Lp=1.54, Lw=0.81, Dp=0.28)"

      chevron_angle:
        title: "Chevron Angle"
        unit: "°"
        element: checkbox_grid
        color: green
        variable: "Sa"

      hot_passes:
        title: "Hot Stream Passes"
        element: checkbox_grid
        color: blue
        variable: "Nph"
        value_labels: {1: "1 pass", 2: "2 passes"}

      cold_passes:
        title: "Cold Stream Passes"
        element: checkbox_grid
        color: blue
        variable: "Npc"
        value_labels: {1: "1 pass", 2: "2 passes"}

  # ============================================================
  # RESULTS PAGE
  # ============================================================
  results:
    title: "Results"
    columns:
      - [hot_stream_results, cold_stream_results, summary_data]
      - [unit_geometry]
      - [thermo_properties, pressure_drop]
      - [optimization_results]

    sections:

      hot_stream_results:
        title: "HOT STREAM"
        element: data_table
        color: green_display
        rows:
          - {label: "Mass flow rate", key: "mh", unit: "kg/s"}
          - {label: "Inlet temperature", key: "Thi", unit: "°C"}
          - {label: "Outlet temperature", key: "Tho", unit: "°C"}
          - {label: "Density", key: "roh", unit: "kg/m³"}
          - {label: "Viscosity", key: "mih", unit: "mPa s", display_factor: 1000}
          - {label: "Heat capacity", key: "Cph", unit: "J/(kg K)"}
          - {label: "Thermal cond.", key: "kh", unit: "W/(m K)"}
          - {label: "Fouling factor", key: "Rfh", unit: "m² K/W"}

      cold_stream_results:
        title: "COLD STREAM"
        element: data_table
        color: green_display
        rows:
          - {label: "Mass flow rate", key: "mc", unit: "kg/s"}
          - {label: "Inlet temperature", key: "Tci", unit: "°C"}
          - {label: "Outlet temperature", key: "Tco", unit: "°C"}
          - {label: "Density", key: "roc", unit: "kg/m³"}
          - {label: "Viscosity", key: "mic", unit: "mPa s", display_factor: 1000}
          - {label: "Heat capacity", key: "Cpc", unit: "J/(kg K)"}
          - {label: "Thermal cond.", key: "kc", unit: "W/(m K)"}
          - {label: "Fouling factor", key: "Rfc", unit: "m² K/W"}

      summary_data:
        title: ""
        element: data_table
        color: green_display
        rows:
          - {label: "Heat load", key: "Q", unit: "kW", computed: true}
          - {label: "LMTD", key: "LMTD", unit: "°C", computed: true}

      unit_geometry:
        title: "UNIT GEOMETRY"
        element: data_table
        color: blue_display
        rows:
          - {label: "Number of plates", key: "Ntp", result_var: true}
          - {label: "Plate size index", key: "Pl", result_var: true}
          - {label: "Chevron angle", key: "Sa", unit: "°", result_var: true}
          - {label: "Hot passes", key: "Nph", result_var: true}
          - {label: "Cold passes", key: "Npc", result_var: true}
          - {label: "Plate length", key: "Lp", unit: "m", computed: true}
          - {label: "Plate width", key: "Lw", unit: "m", computed: true}
          - {label: "Port diameter", key: "Dp", unit: "m", computed: true}
          - {label: "Heat transfer area", key: "A_total", unit: "m²", computed: true}
          - {label: "Correction factor", key: "F", computed: true}
          - {label: "Area/required area ratio", key: "A_ratio", computed: true}

      thermo_properties:
        title: "THERMO PROPERTIES"
        element: data_table
        color: yellow_display
        subsections:
          - title: "HOT SIDE"
            rows:
              - {label: "Velocity flow", key: "vh", unit: "m/s", computed: true}
              - {label: "Reynolds number", key: "Reh", computed: true}
              - {label: "Conv. heat transfer coeff.", key: "hh", unit: "W/(m² K)", computed: true}
          - title: "COLD SIDE"
            rows:
              - {label: "Velocity flow", key: "vc", unit: "m/s", computed: true}
              - {label: "Reynolds number", key: "Rec", computed: true}
              - {label: "Conv. heat transfer coeff.", key: "hc", unit: "W/(m² K)", computed: true}
        footer_rows:
          - {label: "Overall heat transfer coeff. (dirty)", key: "U", unit: "W/(m² K)", computed: true}
          - {label: "Overall heat transfer coeff. (clean)", key: "Uc", unit: "W/(m² K)", computed: true}

      pressure_drop:
        title: "PRESSURE DROP"
        element: data_table
        color: red_display
        rows:
          - {label: "Hot pressure drop", key: "DPh", unit: "kPa", computed: true}
          - {label: "Cold pressure drop", key: "DPc", unit: "kPa", computed: true}

      optimization_results:
        title: "OPTIMIZATION"
        element: data_table
        color: blue_display
        subsections:
          - title: ""
            rows:
              - {label: "Objective function", key: "OF_value", unit_from: "OF", computed: true, highlight: true}
          - title: "ECONOMICS"
            rows:
              - {label: "Capital cost", key: "CAPEX", unit: "$", computed: true}
              - {label: "Hot side operational cost", key: "OPEX_h", unit: "$/y", computed: true}
              - {label: "Cold side operational cost", key: "OPEX_c", unit: "$/y", computed: true}
              - {label: "Operational cost", key: "OPEX_total", unit: "$/y", computed: true}
              - {label: "Total annualized cost", key: "TAC", unit: "$/y", computed: true}
