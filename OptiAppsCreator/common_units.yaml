unit_dimensions:
  temperature:
    base: degC
    options: [degC, K, degF]
  mass_flow:
    base: kg/s
    options: [kg/s, kg/h, lb/h]
  pressure:
    base: Pa
    options: [Pa, kPa, bar, psi]
  pressure_kpa:
    base: kPa
    options: [Pa, kPa, bar, psi]
  density:
    base: kg/m3
    options: [kg/m3, g/cm3, lb/ft3]
  heat_capacity:
    base: J/kg/K
    options: [J/kg/K, kJ/kg/K]
  viscosity:
    base: Pa.s
    options: [Pa.s, cP]
  thermal_conductivity:
    base: W/m/K
    options: [W/m/K]
  heat_transfer_coefficient:
    base: W/m2/K
    options: [W/m2/K]
  fouling_factor:
    base: m2.K/W
    options: [m2.K/W]
  length:
    base: m
    options: [m, mm, inch, ft]
  velocity:
    base: m/s
    options: [m/s, ft/s]
  area:
    base: m2
    options: [m2, ft2]
  power:
    base: kW
    options: [W, kW, MW]
  percent:
    base: percent
    options: [percent, fraction]
  fraction:
    base: fraction
    options: [fraction, percent]
  dimensionless:
    base: dimensionless
    options: [dimensionless]
  count:
    base: count
    options: [count]
  energy_cost:
    base: $/kWh
    options: [$/kWh]
  money:
    base: $
    options: [$]
  annual_money:
    base: $/year
    options: [$/year, $/y]
  angle:
    base: deg
    options: [deg, rad]

