{% extends "base.html" %}

{% block content %}
<main class="min-h-[calc(100vh-140px)] bg-slate-100 p-6">
    <div class="max-w-4xl mx-auto bg-white border border-slate-200 rounded-2xl shadow-xl overflow-hidden">
        <div class="bg-slate-800 text-white px-6 py-4 flex items-center justify-between">
            <div>
                <h2 id="project-directory-title" class="text-xl font-bold">Project Directory</h2>
                <p id="project-directory-subtitle" class="text-xs text-slate-300">Model: {{ model_name }}</p>
            </div>
            <button onclick="loadProjectList()" class="bg-white/10 hover:bg-white/20 px-4 py-2 rounded-full text-xs font-bold">
                <i class="fas fa-sync-alt mr-1"></i> Refresh
            </button>
        </div>

        <div id="projects-error" class="hidden m-4 p-3 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm"></div>

        <div class="p-6 grid grid-cols-1 md:grid-cols-[1fr_260px] gap-6">
            <div>
                <h3 id="project-list-title" class="font-bold text-slate-700 mb-3">Projects</h3>
                <div id="project-list" class="border border-slate-200 rounded-xl divide-y divide-slate-100 overflow-hidden bg-slate-50">
                    <div class="p-4 text-sm text-slate-500">Loading projects...</div>
                </div>
            </div>

            <aside class="bg-slate-50 border border-slate-200 rounded-xl p-4 h-fit">
                <h3 class="font-bold text-slate-700 mb-3">Actions</h3>
                <p id="project-scope-help" class="text-xs text-slate-500 mb-4">Projects are restricted to the current model directory.</p>
                <button onclick="saveAsCloud()" class="w-full bg-blue-600 text-white px-4 py-2 rounded-full text-xs font-bold hover:bg-blue-700 mb-2">
                    Save Current As Cloud
                </button>
                <button onclick="saveAsLocal()" class="w-full bg-white text-blue-600 border border-blue-200 px-4 py-2 rounded-full text-xs font-bold hover:bg-blue-50 mb-2">
                    Save Current As Local
                </button>
                <button onclick="window.location.href='problem_data.html'" class="w-full bg-slate-700 text-white px-4 py-2 rounded-full text-xs font-bold hover:bg-slate-800">
                    Back To Problem Data
                </button>
            </aside>
        </div>
    </div>
</main>

<script>
function showProjectError(message) {
    const box = document.getElementById('projects-error');
    box.textContent = message;
    box.classList.remove('hidden');
}

function clearProjectError() {
    document.getElementById('projects-error').classList.add('hidden');
}

function getProjectScope() {
    var scope = new URLSearchParams(window.location.search).get('scope') || 'users';
    return scope === 'examples' ? 'examples' : 'users';
}

function configureScopeLabels() {
    var scope = getProjectScope();
    var isExamples = scope === 'examples';
    document.getElementById('project-directory-title').textContent = isExamples ? 'Example Projects' : 'User Projects';
    document.getElementById('project-directory-subtitle').textContent = 'Model: {{ model_name }} | Scope: ' + (isExamples ? 'Example_Projects' : 'User_Projects');
    document.getElementById('project-list-title').textContent = isExamples ? 'Available examples' : 'User cloud projects';
    document.getElementById('project-scope-help').innerHTML = 'Projects are restricted to <code>{{ model_name }}/Projects/' + (isExamples ? 'Example_Projects' : 'User_Projects') + '/</code>';
}

async function loadProjectList() {
    clearProjectError();
    const list = document.getElementById('project-list');
    list.innerHTML = '<div class="p-4 text-sm text-slate-500">Loading projects...</div>';
    try {
        const scope = getProjectScope();
        const response = await fetch(API_PROJECTS_URL + '?scope=' + encodeURIComponent(scope));
        if (!response.ok) throw new Error(await response.text());
        const data = await response.json();
        const projects = data.projects || [];
        if (!projects.length) {
            list.innerHTML = '<div class="p-4 text-sm text-slate-500">No projects found.</div>';
            return;
        }
        list.innerHTML = projects.map(function(project) {
            return '<div class="p-4 flex items-center justify-between bg-white">'
                + '<div><div class="font-bold text-slate-700">' + project.name + '</div>'
                + '<div class="text-xs text-slate-400">' + project.file + '</div></div>'
                + '<button onclick="loadProject(\'' + project.name + '\')" class="bg-green-600 text-white px-4 py-1 rounded-full text-xs font-bold hover:bg-green-700">' + (scope === 'examples' ? 'Load Example' : 'Load User Project') + '</button>'
                + '</div>';
        }).join('');
    } catch(e) {
        list.innerHTML = '<div class="p-4 text-sm text-red-500">Could not load projects.</div>';
        showProjectError(e.message);
    }
}

async function loadProject(name) {
    clearProjectError();
    try {
        const scope = getProjectScope();
        const response = await fetch(API_PROJECTS_URL + '/' + encodeURIComponent(name) + '?scope=' + encodeURIComponent(scope));
        if (!response.ok) throw new Error(await response.text());
        const project = await response.json();
        if (project.model !== MODEL) throw new Error('Project model mismatch.');

        applyProjectPayload(project, scope === 'examples' ? 'example' : 'cloud');
        window.location.href = 'problem_data.html';
    } catch(e) {
        showProjectError(e.message);
    }
}

document.addEventListener('DOMContentLoaded', function() {
    configureScopeLabels();
    loadProjectList();
});
</script>
{% endblock %}
