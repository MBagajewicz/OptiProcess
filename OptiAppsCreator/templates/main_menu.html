<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OptiHexx — Main Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700;1,900&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #f0f4f8; font-family: 'Roboto', sans-serif; }
        {% include "optihexx_logo_styles.html" %}
        .calculation-mode-container {
            width: min(600px, calc(100vw - 32px));
            margin-bottom: clamp(24px, 4vw, 32px);
            overflow: hidden;
            border: 3px solid #1a5a4a;
            border-radius: 25px;
            background: linear-gradient(180deg, #d4f5e8 0%, #b8ede0 100%);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .calculation-mode-title-section {
            padding: 20px 30px 0;
            text-align: center;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.3) 0%, rgba(255, 255, 255, 0) 100%);
        }
        .calculation-mode-title {
            margin: 0;
            color: #e63946;
            font-size: clamp(28px, 6vw, 36px);
            font-style: italic;
            font-weight: 700;
        }
        .calculation-mode-divider {
            height: 2px;
            margin-top: 15px;
            background-color: #ccc;
        }
        .calculation-mode-options {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 18px 25px;
            padding: 22px 30px 25px;
        }
        .calculation-mode-option {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #666;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            user-select: none;
        }
        .calculation-mode-option input {
            width: 18px;
            height: 18px;
            accent-color: #1a5a4a;
            cursor: pointer;
        }
        .calculation-mode-option input:checked + span {
            color: #1a5a4a;
            font-weight: 600;
        }
        .menu-box { background-color: #b8daba; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2), 0 8px 10px -6px rgba(0,0,0,0.2); }
        .btn-shadow { box-shadow: inset 0 1px 0 0 rgba(255,255,255,0.4); }
        @media (max-width: 600px) {
            .calculation-mode-options {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-start min-h-screen px-4 pt-6 sm:pt-10">

    <!-- Logo -->
    <div class="mb-6 sm:mb-8">
        {% set logo_compact = true %}
        {% include "optihexx_logo.html" %}
    </div>

    <!-- Calculation Mode -->
    <section class="calculation-mode-container" aria-labelledby="calculation-mode-title">
        <div class="calculation-mode-title-section">
            <h1 id="calculation-mode-title" class="calculation-mode-title">Calculation Mode</h1>
            <div class="calculation-mode-divider"></div>
        </div>
        <div class="calculation-mode-options">
            {% for mode in calculation_modes %}
            <label class="calculation-mode-option">
                <input type="radio" name="calculation-mode" value="{{ mode.id }}"{% if mode.selected %} checked{% endif %}>
                <span>{{ mode.label }}</span>
            </label>
            {% endfor %}
        </div>
    </section>

    <!-- Menu Section -->
    <div class="menu-box w-full max-w-[600px] border border-black rounded-[15px] p-4 sm:p-6 flex flex-col items-center">
        <div class="grid w-full grid-cols-1 sm:flex sm:flex-wrap sm:justify-center gap-2 mb-4">
            {% for model in models %}
            <a href="{{ model.link }}" class="{{ model.css }} block w-full sm:w-auto px-4 py-2 sm:py-1 rounded-full text-center text-xs font-bold border border-gray-300 btn-shadow">
                {{ model.label }}
            </a>
            {% endfor %}
        </div>
        <button onclick="logout()" class="bg-[#3b5998] text-white w-full sm:w-auto px-6 py-2 sm:py-1 rounded-full text-xs font-bold border border-black shadow-md">
            Logout
        </button>
    </div>

    <script>
    async function requireAuth() {
        const response = await fetch('/api/auth/me', {credentials: 'include'});
        if (!response.ok) window.location.href = '/ui/login.html';
    }

    async function logout() {
        await fetch('/api/auth/logout', {method: 'POST', credentials: 'include'});
        window.location.href = '/ui/login.html';
    }

    const calculationModes = document.querySelectorAll('input[name="calculation-mode"]');
    const savedCalculationMode = sessionStorage.getItem('optihexxCalculationMode');
    if (savedCalculationMode) {
        const savedInput = Array.from(calculationModes).find(input => input.value === savedCalculationMode);
        if (savedInput) savedInput.checked = true;
    }
    calculationModes.forEach(input => {
        input.addEventListener('change', () => {
            if (input.checked) sessionStorage.setItem('optihexxCalculationMode', input.value);
        });
    });

    requireAuth();
    </script>

</body>
</html>
