<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OptiHexx — Main Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Roboto+Mono&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #f0f4f8; font-family: 'Roboto', sans-serif; }
        .header-font { font-family: 'Playfair Display', serif; font-style: italic; }
        .menu-font { font-family: 'Roboto Mono', monospace; }
        .header-box { background: linear-gradient(to bottom, #ffff33 0%, #ffcc66 50%, #ff9980 100%); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3), 0 8px 10px -6px rgba(0,0,0,0.3); }
        .menu-box { background-color: #b8daba; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2), 0 8px 10px -6px rgba(0,0,0,0.2); }
        .btn-shadow { box-shadow: inset 0 1px 0 0 rgba(255,255,255,0.4); }
    </style>
</head>
<body class="flex flex-col items-center justify-start min-h-screen px-4 pt-6 sm:pt-10">

    <!-- Header Section -->
    <div class="header-box w-full max-w-[600px] border-2 border-black rounded-[20px] p-4 sm:p-6 text-center mb-6 sm:mb-8">
        <h1 class="header-font text-5xl sm:text-7xl text-black mb-2 leading-none" style="letter-spacing: -2px;">{{ header.title }}</h1>
        <h2 class="header-font text-xl sm:text-3xl text-black mb-4 leading-tight">{{ header.subtitle }}</h2>
        <p class="text-gray-600 text-sm font-bold mb-1">{{ header.prototype }}</p>
        <p class="menu-font text-gray-600 text-sm font-bold tracking-widest">MAIN MENU</p>
    </div>

    <!-- Menu Section -->
    <div class="menu-box w-full max-w-[600px] border border-black rounded-[15px] p-4 sm:p-6 flex flex-col items-center">
        <div class="grid w-full grid-cols-1 sm:flex sm:flex-wrap sm:justify-center gap-2 mb-4">
            {% for model in models %}
            <a href="{{ model.link }}" class="{{ model.css }} block w-full sm:w-auto px-4 py-2 sm:py-1 rounded-full text-center text-xs font-bold border border-gray-300 btn-shadow">
                {{ model.label }}
            </a>
            {% endfor %}
        </div>
        <button onclick="logout()" class="bg-[#3b5998] text-white w-full sm:w-auto px-6 py-2 sm:py-1 rounded-full text-xs font-bold border border-black shadow-md">
            Logout
        </button>
    </div>

    <script>
    async function requireAuth() {
        const response = await fetch('/api/auth/me', {credentials: 'include'});
        if (!response.ok) window.location.href = '/ui/login.html';
    }

    async function logout() {
        await fetch('/api/auth/logout', {method: 'POST', credentials: 'include'});
        window.location.href = '/ui/login.html';
    }

    requireAuth();
    </script>

</body>
</html>
