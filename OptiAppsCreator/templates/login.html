<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OptiHexx — Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700;1,900&display=swap" rel="stylesheet">
    <style>
        {% include "optihexx_logo_styles.html" %}
        .login-production-panel {
            position: relative;
            width: min(456px, calc(100vw - 32px));
            margin-top: clamp(20px, 4vw, 32px);
            overflow: hidden;
            border: 3px solid #1a3a52;
            border-radius: clamp(16px, 3vw, 25px);
            background: linear-gradient(180deg, #d4f5e8 0%, #b8ede0 100%);
            padding: clamp(14px, 3vw, 20px) clamp(10px, 2.5vw, 16px);
            text-align: center;
        }
        .login-production-panel::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(60% 90% at 50% 30%, rgba(255, 255, 255, 0.3) 0%, rgba(255, 255, 255, 0) 100%);
            pointer-events: none;
        }
        .login-production-text {
            position: relative;
            color: #e63946;
            font-family: 'Amasis MT Pro', 'Amasis MT', Georgia, serif;
            font-size: clamp(14px, 4.8vw, 26px);
            font-style: italic;
            font-weight: 500;
            line-height: 1.15;
            white-space: nowrap;
        }
    </style>
</head>
<body class="bg-[#f4f7fa] min-h-screen flex flex-col items-center justify-center py-10 font-sans">

    <!-- Main Banner -->
    {% set logo = login.logo %}
    {% set logo_compact = false %}
    {% include "optihexx_logo.html" %}

    <!-- Web Production -->
    <div class="login-production-panel">
        <p class="login-production-text">{{ login.production.text }}</p>
    </div>

    <!-- Login Form -->
    <form class="bg-[#eef2f5] rounded-xl p-4 mt-10 w-[260px]" onsubmit="login(event)">
        <div class="relative mt-2">
            <label class="absolute -top-2.5 left-2 bg-[#eef2f5] px-1 text-[11px] text-[#4a78a6]">User</label>
            <input id="username" type="text" class="w-full bg-transparent border border-[#4a78a6] rounded-md px-3 py-2.5 text-sm outline-none text-black" value="{{ login.default_user }}">
        </div>
        <div class="relative mt-4">
            <input id="password" type="password" placeholder="Password" class="w-full bg-transparent border border-gray-800 rounded-md px-3 py-2.5 pr-9 text-sm outline-none placeholder-gray-600 text-black">
            <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-800 text-sm" aria-label="Show or hide password">
                <i id="password-eye" class="fas fa-eye"></i>
            </button>
        </div>
        <button type="submit" class="mt-4 border border-[#d0d7de] rounded-full px-5 py-1.5 text-[#4a78a6] text-xs bg-white hover:bg-gray-50 transition-colors">Login</button>
        <div id="login-message" class="mt-3 text-xs text-center font-semibold"></div>
    </form>

    <script>
    function setMessage(message, isError) {
        const box = document.getElementById('login-message');
        box.textContent = message;
        box.className = 'mt-3 text-xs text-center font-semibold ' + (isError ? 'text-red-600' : 'text-green-700');
    }

    async function login(event) {
        if (event) event.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                credentials: 'include',
                body: JSON.stringify({username: username, password: password})
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.detail || 'Login failed');
            window.location.href = '/ui/main_menu.html';
        } catch(e) {
            setMessage(e.message, true);
        }
    }

    function togglePasswordVisibility() {
        const input = document.getElementById('password');
        const icon = document.getElementById('password-eye');
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        icon.classList.toggle('fa-eye', !show);
        icon.classList.toggle('fa-eye-slash', show);
    }
    </script>

</body>
</html>
