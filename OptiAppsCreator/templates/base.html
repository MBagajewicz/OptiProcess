<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OptiHexx — {{ page_title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .header-font { font-family: 'Playfair Display', serif; }
        .input-container { position: relative; margin-top: 12px; margin-bottom: 8px; }
        .input-label { position: absolute; top: -10px; left: 10px; padding: 0 4px; font-size: 0.7rem; z-index: 10; }
        .custom-input { width: 100%; border: 1px solid; border-radius: 4px; padding: 4px 8px; font-size: 0.9rem; background: transparent; }
        .form_group label { margin-bottom: 1px; display: block; position: static; background: none; }
        .checkbox-item { width: 18px; height: 18px; background-color: white !important; color: black !important; border-radius: 2px; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; }
        .checkbox-item.checked { background-color: white !important; color: black !important; }
        .checkbox-grid-input { background-color: rgba(255,255,255,0.3); border: 1px solid rgba(255,255,255,0.5); border-radius: 4px; padding: 4px 8px; font-size: 12px; width: 100%; text-align: left; color: inherit; }
        .bg-industrial { background-image: linear-gradient(rgba(255,255,255,0.15), rgba(255,255,255,0.15)), url('https://placehold.co/1920x1080/2c3e50/ffffff?text=Industrial+Heat+Exchanger+Background'); background-size: cover; background-position: center; }
        .numeric-invalid { border-color: #dc2626 !important; box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.25); }
        .recommended-limit-warning { background-color: #fde68a !important; border-color: #f59e0b !important; box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.25); }
    </style>
    {% block extra_style %}{% endblock %}
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Header -->
    <div class="p-2">
        <div class="bg-gradient-to-r from-yellow-400 via-yellow-300 to-orange-400 border-2 border-black rounded-lg p-4 text-center shadow-md">
            <h1 class="header-font text-3xl italic font-bold">{{ header.title }}</h1>
            <p class="text-xs font-semibold italic">{{ header.subtitle }}</p>
            <p class="text-[10px] text-gray-600">{{ header.prototype }}</p>
        </div>
    </div>

    {% include "model_navigation.html" %}

    <div id="model-workspace" class="items-start pt-2 lg:grid lg:grid-cols-[220px_minmax(0,1fr)]">
        {% include "model_sidebar.html" %}
        <main class="min-w-0">
            {% block content %}{% endblock %}
        </main>
    </div>

    <div id="close-session-modal" class="hidden fixed inset-0 z-[100] bg-black/40 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl border border-gray-200 w-full max-w-md p-5">
            <h2 class="text-lg font-bold text-gray-800 mb-2">Unsaved changes</h2>
            <p class="text-sm text-gray-600 mb-4">The current project has unsaved changes. Choose how to continue.</p>
            <div class="space-y-2">
                <button type="button" onclick="closeAfterSaveCloud()" class="w-full bg-blue-600 text-white px-4 py-2 rounded-full text-sm font-bold hover:bg-blue-700">Save Design</button>
                <button type="button" onclick="closeAfterSaveAsCloud()" class="w-full bg-blue-500 text-white px-4 py-2 rounded-full text-sm font-bold hover:bg-blue-600">Save Design As...</button>
                <button type="button" onclick="hideCloseSessionModal()" class="w-full bg-gray-100 text-gray-700 px-4 py-2 rounded-full text-sm font-bold hover:bg-gray-200">Cancel LOGOUT</button>
                <button type="button" onclick="logoutWithoutSave()" class="w-full bg-red-600 text-white px-4 py-2 rounded-full text-sm font-bold hover:bg-red-700">LOGOUT without Save</button>
            </div>
        </div>
    </div>

    <script>
    const MODEL = '{{ model_name }}';
    const SYNC_SCALAR_KEYS = {{ sync_scalar_keys | default([]) | tojson }};
    const GEOMETRIC_SCALAR_KEYS = {{ geometric_scalar_keys | default([]) | tojson }};
    const UNIT_CONVERSIONS = {{ unit_conversions | default({}) | tojson }};
    const API_PROJECTS_URL = window.location.origin + '/api/projects/' + MODEL;
    {% include "model_context_script.html" %}

    function modelKey(name) { return 'optihex_' + MODEL + '_' + name; }
    function problemStorageKey() { return modelKey('problem_data'); }
    function geomStorageKey() { return modelKey('geometric_data'); }
    function geometricStandardsStorageKey() { return modelKey('geometric_standards'); }
    function parameterUnitsStorageKey() { return modelKey('parameter_units'); }
    function resultUnitsStorageKey() { return modelKey('result_units'); }
    function currentProjectKey() { return modelKey('current_project'); }
    function currentUserProjectIdKey() { return modelKey('current_user_project_id'); }
    function currentUserProjectNameKey() { return modelKey('current_user_project_name'); }
    function dirtyKey() { return modelKey('project_dirty'); }
    function originKey() { return modelKey('project_origin'); }
    function problemClearedKey() { return modelKey('problem_data_cleared'); }
    function lastSavedProblemKey() { return modelKey('last_saved_problem_data'); }
    function lastSavedGeomKey() { return modelKey('last_saved_geometric_data'); }
    function lastSavedGeometricStandardsKey() { return modelKey('last_saved_geometric_standards'); }
    function lastSavedParameterUnitsKey() { return modelKey('last_saved_parameter_units'); }
    function lastSavedResultUnitsKey() { return modelKey('last_saved_result_units'); }
    function lastSavedProjectKey() { return modelKey('last_saved_project_name'); }
    function lastSavedUserProjectIdKey() { return modelKey('last_saved_user_project_id'); }
    function lastSavedUserProjectNameKey() { return modelKey('last_saved_user_project_name'); }
    function lastSavedOriginKey() { return modelKey('last_saved_origin'); }
    function lastSavedProblemClearedKey() { return modelKey('last_saved_problem_data_cleared'); }
    function lastOptimizationSignatureKey() { return modelKey('last_optimization_signature'); }
    function lastOptimizationResultKey() { return modelKey('last_optimization_result'); }
    function lastOptimizationSessionDataKey() { return modelKey('last_optimization_session_data'); }
    function optimizationDirtyKey() { return modelKey('optimization_dirty'); }

    function scalarGeometryParameterKeys() { return SYNC_SCALAR_KEYS || []; }
    function geometricScalarKeys() { return GEOMETRIC_SCALAR_KEYS || []; }

    function getJson(key, fallback) {
        try {
            const raw = sessionStorage.getItem(key);
            return raw ? JSON.parse(raw) : fallback;
        } catch(e) { return fallback; }
    }

    async function requireAuth() {
        const response = await fetch('/api/auth/me', {credentials: 'include'});
        if (!response.ok) window.location.href = '/ui/login.html';
    }

    function setJson(key, value) {
        sessionStorage.setItem(key, JSON.stringify(value));
    }

    function sanitizeNumericValue(value) {
        let clean = String(value).replace(/[^0-9.\-]/g, '');
        clean = clean.replace(/(?!^)-/g, '');
        const dot = clean.indexOf('.');
        if (dot !== -1) clean = clean.slice(0, dot + 1) + clean.slice(dot + 1).replace(/\./g, '');
        return clean;
    }

    function isStrictNumber(value) {
        return /^-?(?:\d+|\d*\.\d+)$/.test(String(value).trim());
    }

    function parseStrictNumber(value) {
        return parseFloat(String(value).trim());
    }

    function conversionRule(baseUnit, displayUnit) {
        if (!baseUnit || !displayUnit || baseUnit === displayUnit) return {factor: 1, offset: 0};
        const byBase = UNIT_CONVERSIONS[baseUnit] || {};
        return byBase[displayUnit] || null;
    }

    function convertDisplayToBase(value, baseUnit, displayUnit) {
        const numeric = parseStrictNumber(value);
        const rule = conversionRule(baseUnit, displayUnit);
        if (!rule) return numeric;
        return numeric * Number(rule.factor) + Number(rule.offset || 0);
    }

    function convertBaseToDisplay(value, baseUnit, displayUnit) {
        const numeric = parseStrictNumber(value);
        const rule = conversionRule(baseUnit, displayUnit);
        if (!rule) return numeric;
        return (numeric - Number(rule.offset || 0)) / Number(rule.factor);
    }

    function formatUnitValue(value) {
        if (typeof value !== 'number' || !Number.isFinite(value)) return value;
        return Number.isInteger(value) ? String(value) : String(Number(value.toFixed(8)));
    }

    function getParameterUnits() {
        return getJson(parameterUnitsStorageKey(), {});
    }

    function setInputDisplayUnit(input, unit) {
        if (!input || !unit) return;
        input.dataset.displayUnit = unit;
        const units = getParameterUnits();
        units[input.dataset.key] = unit;
        setJson(parameterUnitsStorageKey(), units);
    }

    function selectedDisplayUnitForInput(input) {
        if (!input) return null;
        const units = getParameterUnits();
        return units[input.dataset.key] || input.dataset.displayUnit || input.dataset.baseUnit || null;
    }

    function readNumericInputBaseValue(input) {
        const displayUnit = selectedDisplayUnitForInput(input);
        if (input.dataset.baseUnit && displayUnit) return convertDisplayToBase(input.value, input.dataset.baseUnit, displayUnit);
        return parseStrictNumber(input.value);
    }

    function setNumericInputFromBase(input, baseValue) {
        const displayUnit = selectedDisplayUnitForInput(input);
        const value = input.dataset.baseUnit && displayUnit ? convertBaseToDisplay(baseValue, input.dataset.baseUnit, displayUnit) : baseValue;
        input.value = formatUnitValue(value);
    }

    function attachUnitSelectors() {
        const units = getParameterUnits();
        document.querySelectorAll('input[data-key][data-base-unit]').forEach(function(input) {
            if (units[input.dataset.key]) input.dataset.displayUnit = units[input.dataset.key];
        });
        updateUnitLabels();
    }

    function updateUnitLabels() {
        const units = getParameterUnits();
        document.querySelectorAll('[data-unit-label-for]').forEach(function(label) {
            const key = label.dataset.unitLabelFor;
            label.textContent = units[key] || label.dataset.defaultUnit || label.textContent;
        });
        document.querySelectorAll('[data-var][data-base-unit]').forEach(function(panel) {
            const key = panel.dataset.var;
            panel.dataset.displayUnit = units[key] || panel.dataset.displayUnit || panel.dataset.baseUnit;
        });
        document.querySelectorAll('[data-option-label-for]').forEach(function(label) {
            const key = label.dataset.optionLabelFor;
            const panel = document.querySelector('[data-var="' + key + '"]');
            if (!panel || !panel.dataset.baseUnit) return;
            const displayUnit = units[key] || panel.dataset.displayUnit || panel.dataset.baseUnit;
            label.textContent = formatUnitValue(convertBaseToDisplay(label.dataset.baseValue, panel.dataset.baseUnit, displayUnit));
        });
    }

    function markNumericValidity(input, valid) {
        input.classList.toggle('numeric-invalid', !valid);
        if (!valid) input.title = 'Only numeric values are accepted.';
        else input.removeAttribute('title');
    }

    function updateRecommendedLimitWarning(input) {
        if (!input || input.dataset.recommendedMin === undefined || input.dataset.recommendedMax === undefined) return;
        const min = parseFloat(input.dataset.recommendedMin);
        const max = parseFloat(input.dataset.recommendedMax);
        const isValidNumber = isStrictNumber(input.value);
        const value = isValidNumber ? readNumericInputBaseValue(input) : NaN;
        const outOfRange = isValidNumber && (value < min || value > max);
        input.classList.toggle('recommended-limit-warning', outOfRange);
        if (outOfRange) input.title = 'Recommended range: ' + min + ' to ' + max + '.';
        else if (input.title && input.title.indexOf('Recommended range:') === 0) input.removeAttribute('title');
    }

    function updateRecommendedLimitWarnings(selector) {
        document.querySelectorAll(selector || 'input[data-recommended-min][data-recommended-max]').forEach(updateRecommendedLimitWarning);
    }

    function validateNumericInputs(selector) {
        const invalid = [];
        document.querySelectorAll(selector).forEach(function(input) {
            if (input.disabled || input.type === 'hidden') return;
            const valid = isStrictNumber(input.value);
            markNumericValidity(input, valid);
            updateRecommendedLimitWarning(input);
            if (!valid) invalid.push(input);
        });
        if (invalid.length) {
            invalid[0].focus();
            alert('Only numeric values are accepted. Please correct the highlighted fields.');
            return false;
        }
        return true;
    }

    function attachNumericFiltering(selector) {
        document.querySelectorAll(selector).forEach(function(input) {
            input.addEventListener('input', function() {
                const clean = sanitizeNumericValue(this.value);
                if (this.value !== clean) this.value = clean;
                markNumericValidity(this, this.value ? isStrictNumber(this.value) : false);
                updateRecommendedLimitWarning(this);
                setDirty(true);
            });
        });
    }

    function attachEnterToAdvance(selector, collectFnName, afterCollectFnName) {
        const fields = Array.from(document.querySelectorAll(selector)).filter(function(input) {
            return !input.disabled && input.type !== 'hidden';
        });
        fields.forEach(function(input, index) {
            input.addEventListener('keydown', async function(event) {
                if (event.key !== 'Enter') return;
                event.preventDefault();
                const collectFn = window[collectFnName];
                if (typeof collectFn === 'function' && collectFn(true) === null) return;
                const afterCollectFn = window[afterCollectFnName];
                if (typeof afterCollectFn === 'function' && await afterCollectFn(true) === null) return;
                const next = fields[index + 1];
                if (next) {
                    next.focus();
                    if (typeof next.select === 'function') next.select();
                }
            });
        });
    }

    function getCurrentProject() {
        return sessionStorage.getItem(currentProjectKey()) || '';
    }

    function setCurrentProject(name) {
        sessionStorage.setItem(currentProjectKey(), name || '');
        updateProjectIndicator();
    }

    function setDirty(value) {
        sessionStorage.setItem(dirtyKey(), value ? 'true' : 'false');
        if (value) sessionStorage.setItem(optimizationDirtyKey(), 'true');
        updateProjectIndicator();
    }

    function setProjectMetadataDirty(value) {
        sessionStorage.setItem(dirtyKey(), value ? 'true' : 'false');
        updateProjectIndicator();
    }

    function isDirty() {
        return sessionStorage.getItem(dirtyKey()) === 'true';
    }

    function updateProjectIndicator() {
        const userProjectName = sessionStorage.getItem(currentUserProjectNameKey()) || 'No User Project';
        const name = getCurrentProject() || 'Unsaved Design';
        const projectEl = document.getElementById('context-project');
        const designEl = document.getElementById('context-design');
        if (projectEl) projectEl.textContent = userProjectName;
        if (designEl) designEl.textContent = name + (isDirty() ? '*' : '');
        updateCalculationStatus();
        renderModelConfigurationSummary();
    }

    function syncCurrentPageState() {
        if (typeof window.collectProblemData === 'function' && window.collectProblemData(false) === null) return false;
        if (typeof window.collectGeometricData === 'function' && window.collectGeometricData(false) === null) return false;
        return true;
    }

    function stableStringify(value) {
        if (Array.isArray(value)) return '[' + value.map(stableStringify).join(',') + ']';
        if (value && typeof value === 'object') {
            return '{' + Object.keys(value).sort().map(function(key) {
                return JSON.stringify(key) + ':' + stableStringify(value[key]);
            }).join(',') + '}';
        }
        return JSON.stringify(value);
    }

    function currentOptimizationSignature() {
        const problem = getJson(problemStorageKey(), null);
        if (!problem) return '';
        return stableStringify({problem: problem, geometric: getJson(geomStorageKey(), {})});
    }

    function hasOptimizationChanges() {
        if (sessionStorage.getItem(optimizationDirtyKey()) === 'true') return true;
        const signature = currentOptimizationSignature();
        if (!signature) return false;
        return signature !== sessionStorage.getItem(lastOptimizationSignatureKey());
    }

    function setOptimizationDirty(value) {
        sessionStorage.setItem(optimizationDirtyKey(), value ? 'true' : 'false');
        updateCalculationStatus();
    }

    function clearOptimizationState() {
        sessionStorage.removeItem(lastOptimizationSignatureKey());
        sessionStorage.removeItem(lastOptimizationResultKey());
        sessionStorage.removeItem(lastOptimizationSessionDataKey());
        sessionStorage.removeItem(optimizationDirtyKey());
        updateCalculationStatus();
    }

    function updateCalculationStatus(status) {
        const el = document.getElementById('context-calculation-status');
        if (!el) return;
        let currentStatus = status;
        if (!currentStatus) {
            if (!sessionStorage.getItem(lastOptimizationResultKey())) currentStatus = 'Not calculated';
            else currentStatus = hasOptimizationChanges() ? 'Pending' : 'Updated';
        }
        const styles = {
            'Not calculated': 'bg-slate-100 text-slate-600',
            'Pending': 'bg-amber-100 text-amber-700',
            'Calculating': 'bg-blue-100 text-blue-700',
            'Updated': 'bg-emerald-100 text-emerald-700',
            'Error': 'bg-red-100 text-red-700'
        };
        el.textContent = currentStatus;
        el.className = 'inline-block rounded-full px-2 py-0.5 text-[10px] ' + (styles[currentStatus] || styles['Not calculated']);
    }

    function navigateModelPage(event, target) {
        if (event) event.preventDefault();
        if (!syncCurrentPageState()) return false;
        window.location.href = target;
        return false;
    }

    function saveSnapshot() {
        sessionStorage.setItem(lastSavedProblemKey(), sessionStorage.getItem(problemStorageKey()) || '{}');
        sessionStorage.setItem(lastSavedGeomKey(), sessionStorage.getItem(geomStorageKey()) || '{}');
        sessionStorage.setItem(lastSavedGeometricStandardsKey(), sessionStorage.getItem(geometricStandardsStorageKey()) || '{}');
        sessionStorage.setItem(lastSavedParameterUnitsKey(), sessionStorage.getItem(parameterUnitsStorageKey()) || '{}');
        sessionStorage.setItem(lastSavedResultUnitsKey(), sessionStorage.getItem(resultUnitsStorageKey()) || '{}');
        sessionStorage.setItem(lastSavedProjectKey(), getCurrentProject());
        sessionStorage.setItem(lastSavedUserProjectIdKey(), sessionStorage.getItem(currentUserProjectIdKey()) || '');
        sessionStorage.setItem(lastSavedUserProjectNameKey(), sessionStorage.getItem(currentUserProjectNameKey()) || '');
        sessionStorage.setItem(lastSavedOriginKey(), sessionStorage.getItem(originKey()) || '');
        sessionStorage.setItem(lastSavedProblemClearedKey(), sessionStorage.getItem(problemClearedKey()) === 'true' ? 'true' : 'false');
    }

    function hasSnapshot() {
        return sessionStorage.getItem(lastSavedProblemKey()) !== null || sessionStorage.getItem(lastSavedGeomKey()) !== null;
    }

    function resetProjectState() {
        if (!hasSnapshot()) {
            alert('No saved or loaded project state is available to reset.');
            return;
        }
        sessionStorage.setItem(problemStorageKey(), sessionStorage.getItem(lastSavedProblemKey()) || '{}');
        sessionStorage.setItem(geomStorageKey(), sessionStorage.getItem(lastSavedGeomKey()) || '{}');
        sessionStorage.setItem(geometricStandardsStorageKey(), sessionStorage.getItem(lastSavedGeometricStandardsKey()) || '{}');
        sessionStorage.setItem(parameterUnitsStorageKey(), sessionStorage.getItem(lastSavedParameterUnitsKey()) || '{}');
        sessionStorage.setItem(resultUnitsStorageKey(), sessionStorage.getItem(lastSavedResultUnitsKey()) || '{}');
        sessionStorage.setItem(currentProjectKey(), sessionStorage.getItem(lastSavedProjectKey()) || '');
        sessionStorage.setItem(currentUserProjectIdKey(), sessionStorage.getItem(lastSavedUserProjectIdKey()) || '');
        sessionStorage.setItem(currentUserProjectNameKey(), sessionStorage.getItem(lastSavedUserProjectNameKey()) || '');
        sessionStorage.setItem(originKey(), sessionStorage.getItem(lastSavedOriginKey()) || '');
        sessionStorage.setItem(problemClearedKey(), sessionStorage.getItem(lastSavedProblemClearedKey()) === 'true' ? 'true' : 'false');
        sessionStorage.setItem(optimizationDirtyKey(), 'false');
        setDirty(false);
        window.location.reload();
    }

    function clearProblemData() {
        sessionStorage.setItem(problemStorageKey(), '{}');
        sessionStorage.removeItem(parameterUnitsStorageKey());
        sessionStorage.setItem(problemClearedKey(), 'true');
        if (typeof window.clearProblemDataForm === 'function') window.clearProblemDataForm();
        setDirty(true);
    }

    function buildProjectPayload(name, userProjectId, userProjectName) {
        if (!syncCurrentPageState()) return null;
        const params = getJson(problemStorageKey(), {});
        const geom = getJson(geomStorageKey(), {});
        const selectedOf = params._selected_of || 'TAC_OF';
        const cleanParams = Object.assign({}, params);
        delete cleanParams._selected_of;
        if (typeof cleanParams.int_rate === 'number') cleanParams.int_rate = cleanParams.int_rate * 0.01;
        const discrete = {};
        Object.keys(geom).forEach(function(k) {
            if (Array.isArray(geom[k])) discrete[k] = geom[k];
            else cleanParams[k] = geom[k];
        });
        return {
            name: name || getCurrentProject(),
            design_name: name || getCurrentProject(),
            user_project_id: userProjectId !== undefined ? userProjectId : (sessionStorage.getItem(currentUserProjectIdKey()) ? parseInt(sessionStorage.getItem(currentUserProjectIdKey()), 10) : null),
            user_project_name: userProjectName !== undefined ? userProjectName : (sessionStorage.getItem(currentUserProjectNameKey()) || null),
            parameters: cleanParams,
            parameter_units: getParameterUnits(),
            result_units: getJson(resultUnitsStorageKey(), {}),
            geometric_standards: getJson(geometricStandardsStorageKey(), {}),
            discrete_variables: discrete,
            selected_of: selectedOf,
            number_of_equipment: 1
        };
    }

    function closeFileMenu() {
        document.getElementById('file-menu').classList.add('hidden');
    }

    function toggleFileMenu() {
        document.getElementById('units-menu').classList.add('hidden');
        document.getElementById('file-menu').classList.toggle('hidden');
    }

    function toggleUnitsMenu() {
        closeFileMenu();
        document.getElementById('units-menu').classList.toggle('hidden');
    }

    function openUnitsConfiguration() {
        document.getElementById('units-menu').classList.add('hidden');
        if (!syncCurrentPageState()) return;
        window.location.href = 'units.html';
    }

    function openResultsUnitsConfiguration() {
        document.getElementById('units-menu').classList.add('hidden');
        if (!syncCurrentPageState()) return;
        window.location.href = 'result_units.html';
    }

    function loadExamples() {
        closeFileMenu();
        window.location.href = 'projects.html?scope=examples';
    }

    async function saveCloud() {
        closeFileMenu();
        const name = getCurrentProject();
        if (!name || sessionStorage.getItem(originKey()) === 'example' || sessionStorage.getItem(originKey()) === 'default') {
            return await saveAsCloud();
        }
        const payload = buildProjectPayload(name);
        if (!payload) return false;
        const response = await fetch(API_PROJECTS_URL + '/' + encodeURIComponent(name), {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        if (!response.ok) {
            alert('Could not save project: ' + await response.text());
            return false;
        }
        setDirty(false);
        sessionStorage.setItem(originKey(), 'cloud');
        saveSnapshot();
        return true;
    }

    function apiDesignsUrl(projectId) {
        return '/api/user-projects/' + projectId + '/designs?model=' + encodeURIComponent(MODEL);
    }

    async function saveAsCloud() {
        closeFileMenu();
        const previousUserProjectId = sessionStorage.getItem(currentUserProjectIdKey()) || '';
        const currentDesignName = getCurrentProject() || 'NewDesign';
        function escapeAttr(value) {
            return String(value).replace(/[&<>"]/g, function(ch) {
                return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[ch];
            });
        }
        function escapeText(value) {
            return String(value).replace(/[&<>]/g, function(ch) {
                return {'&': '&amp;', '<': '&lt;', '>': '&gt;'}[ch];
            });
        }
        let projects = [];
        try {
            const resp = await fetch('/api/user-projects');
            if (!resp.ok) throw new Error(await resp.text());
            const data = await resp.json();
            projects = Array.isArray(data.projects) ? data.projects : [];
        } catch(e) {
            alert('Could not load user projects: ' + (e.message || e));
            return false;
        }

        // Create modal overlay
        const overlay = document.createElement('div');
        overlay.id = 'save-as-modal';
        overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:9999;';

        const modal = document.createElement('div');
        modal.style.cssText = 'background:white;border-radius:12px;padding:24px;width:420px;max-width:90%;box-shadow:0 4px 20px rgba(0,0,0,0.3);';

        modal.innerHTML = '<h3 style="margin:0 0 16px;font-size:18px;font-weight:700;">Save Design As</h3>' +
            '<label style="display:block;font-size:13px;font-weight:600;margin-bottom:4px;">Project:</label>' +
            '<select id="save-as-project-select" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:6px;font-size:14px;margin-bottom:12px;">' +
            (projects.length > 0 ? projects.map(function(p) {
                var id = String(p.id);
                var sel = (id === previousUserProjectId || (!previousUserProjectId && p.name === 'My_Designs')) ? ' selected' : '';
                return '<option value="' + escapeAttr(id) + '" data-name="' + escapeAttr(p.name || '') + '"' + sel + '>' + escapeText(p.name || '') + '</option>';
            }).join('') : '<option value="" disabled selected>No user projects available</option>') +
            '</select>' +
            '<div id="save-as-modal-error" style="display:none;margin:-4px 0 10px;padding:8px;border:1px solid #fecaca;border-radius:6px;background:#fef2f2;color:#b91c1c;font-size:12px;"></div>' +
            '<label style="display:block;font-size:13px;font-weight:600;margin-bottom:4px;">Design name:</label>' +
            '<select id="save-as-design-select" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:6px;font-size:14px;margin-bottom:6px;">' +
            '<option value="__new__" selected>+ New Design...</option>' +
            '</select>' +
            '<input id="save-as-design-input" type="text" value="' + escapeAttr(currentDesignName) + '" placeholder="New design name" style="width:calc(100% - 16px);padding:8px;border:1px solid #3b82f6;border-radius:6px;font-size:14px;margin-bottom:20px;outline:none;">' +
            '<div style="display:flex;gap:8px;justify-content:flex-end;">' +
            '<button id="save-as-cancel-btn" style="padding:8px 20px;border:1px solid #ccc;border-radius:6px;background:#fff;cursor:pointer;font-size:14px;">Cancel</button>' +
            '<button id="save-as-confirm-btn" style="padding:8px 20px;border:none;border-radius:6px;background:#2563eb;color:#fff;cursor:pointer;font-size:14px;">Save</button>' +
            '</div>';

        overlay.appendChild(modal);
        document.body.appendChild(overlay);

        function showSaveAsError(message) {
            const errorBox = document.getElementById('save-as-modal-error');
            if (!errorBox) return;
            errorBox.textContent = message;
            errorBox.style.display = 'block';
        }

        function clearSaveAsError() {
            const errorBox = document.getElementById('save-as-modal-error');
            if (!errorBox) return;
            errorBox.textContent = '';
            errorBox.style.display = 'none';
        }

        // Helper to populate designs dropdown
        async function loadDesignsDropdown(projectId, selectedDesign) {
            const designSelect = document.getElementById('save-as-design-select');
            const designInput = document.getElementById('save-as-design-input');
            try {
                const resp = await fetch(apiDesignsUrl(projectId));
                if (!resp.ok) throw new Error(await resp.text());
                const data = await resp.json();
                const designs = Array.isArray(data.designs) ? data.designs : [];
                var html = '<option value="__new__">+ New Design...</option>';
                var found = false;
                designs.forEach(function(d) {
                    var sel = (d.name === selectedDesign) ? ' selected' : '';
                    if (d.name === selectedDesign) found = true;
                    html += '<option value="' + escapeAttr(d.name) + '"' + sel + '>' + escapeText(d.name) + '</option>';
                });
                designSelect.innerHTML = html;
                if (found) {
                    designInput.value = selectedDesign;
                } else {
                    designSelect.value = '__new__';
                }
            } catch(e) {
                designSelect.innerHTML = '<option value="__new__" selected>+ New Design...</option>';
                showSaveAsError('Could not load designs for this project: ' + (e.message || e));
            }
        }

        // Load designs for the initially selected project
        var initialProjectId = null;
        var initialProjectSelect = document.getElementById('save-as-project-select');
        if (initialProjectSelect && initialProjectSelect.value) {
            initialProjectId = parseInt(initialProjectSelect.value, 10);
        }
        if (initialProjectId) {
            loadDesignsDropdown(initialProjectId, currentDesignName);
        }

        // When user project changes, reload designs dropdown
        document.getElementById('save-as-project-select').addEventListener('change', function() {
            clearSaveAsError();
            var pid = parseInt(this.value, 10);
            if (pid) {
                var curName = document.getElementById('save-as-design-input').value.trim();
                loadDesignsDropdown(pid, curName);
            }
        });

        // When design dropdown changes, fill the text input
        document.getElementById('save-as-design-select').addEventListener('change', function() {
            var val = this.value;
            if (val !== '__new__') {
                document.getElementById('save-as-design-input').value = val;
            } else {
                document.getElementById('save-as-design-input').value = '';
            }
        });

        return new Promise(function(resolve) {
            document.getElementById('save-as-cancel-btn').onclick = function() { overlay.remove(); resolve(false); };
            document.getElementById('save-as-confirm-btn').onclick = async function() {
                clearSaveAsError();
                const confirmButton = document.getElementById('save-as-confirm-btn');
                const sel = document.getElementById('save-as-project-select');
                const designSelect = document.getElementById('save-as-design-select');
                const selectedOption = sel && sel.selectedOptions.length ? sel.selectedOptions[0] : null;
                const userProjectId = sel && sel.value ? parseInt(sel.value, 10) : null;
                const userProjectName = selectedOption ? selectedOption.getAttribute('data-name') || selectedOption.textContent : null;
                if (!userProjectId) { showSaveAsError('Please select a user project.'); return; }
                const name = document.getElementById('save-as-design-input').value.trim();
                if (!name) { showSaveAsError('Please enter a design name.'); return; }
                if (designSelect && designSelect.value !== '__new__' && designSelect.value === name && !confirm('This will overwrite the existing design "' + name + '". Continue?')) return;
                const payload = buildProjectPayload(name, userProjectId, userProjectName);
                if (!payload) { resolve(false); return; }
                confirmButton.disabled = true;
                confirmButton.textContent = 'Saving...';
                try {
                    const response = await fetch(API_PROJECTS_URL, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) throw new Error(await response.text());
                    const data = await response.json();
                    overlay.remove();
                    setCurrentProject(data.name || name);
                    if (data.user_project_id) sessionStorage.setItem(currentUserProjectIdKey(), data.user_project_id);
                    if (data.user_project_name) sessionStorage.setItem(currentUserProjectNameKey(), data.user_project_name);
                    sessionStorage.setItem(originKey(), 'cloud');
                    setDirty(false);
                    saveSnapshot();
                    resolve(true);
                } catch(e) {
                    showSaveAsError('Could not save project: ' + (e.message || e));
                    confirmButton.disabled = false;
                    confirmButton.textContent = 'Save';
                }
            };
        });
    }

    function applyProjectPayload(project, source) {
        const params = Object.assign({}, project.parameters || {});
        setJson(parameterUnitsStorageKey(), project.parameter_units || {});
        updateUnitLabels();
        if (typeof params.int_rate === 'number') params.int_rate = params.int_rate * 100;
        params._selected_of = project.selected_of || 'TAC_OF';
        const geom = Object.assign({}, project.discrete_variables || {});
        geometricScalarKeys().forEach(function(key) {
            if (params[key] !== undefined) geom[key] = params[key];
        });
        setJson(problemStorageKey(), params);
        setJson(geomStorageKey(), geom);
        setJson(geometricStandardsStorageKey(), project.geometric_standards || {});
        setJson(resultUnitsStorageKey(), project.result_units || {});
        clearOptimizationState();
        setCurrentProject(project.name || 'LocalProject');
        if (project.user_project_id) sessionStorage.setItem(currentUserProjectIdKey(), project.user_project_id);
        else sessionStorage.removeItem(currentUserProjectIdKey());
        if (project.user_project_name) sessionStorage.setItem(currentUserProjectNameKey(), project.user_project_name);
        else sessionStorage.removeItem(currentUserProjectNameKey());
        sessionStorage.setItem(originKey(), source || 'cloud');
        sessionStorage.setItem(problemClearedKey(), 'false');
        setDirty(false);
        saveSnapshot();
    }

    function setSectionDefaultInputValue(key, value) {
        document.querySelectorAll('input[data-key], select[data-key]').forEach(function(input) {
            if (input.dataset.key !== key) return;
            if (input.dataset.numeric === 'true' && isStrictNumber(value)) setNumericInputFromBase(input, value);
            else input.value = value;
            if (input.dataset.numeric === 'true') markNumericValidity(input, isStrictNumber(input.value));
        });
    }

    async function loadDefaultSectionValues(keys, target) {
        try {
            const response = await fetch(API_PROJECTS_URL + '/default-design');
            if (!response.ok) throw new Error(await response.text());
            const design = await response.json();
            const params = design.parameters || {};
            (keys || []).forEach(function(key) {
                if (params[key] === undefined) return;
                let value = params[key];
                if (key === 'int_rate' && typeof value === 'number') value = value * 100;
                setSectionDefaultInputValue(key, value);
            });
            if (target === 'geometric' && typeof window.collectGeometricData === 'function') window.collectGeometricData(true);
            else if (typeof window.collectProblemData === 'function') {
                window.collectProblemData(true);
                if (typeof window.refreshProblemCalculatedFields === 'function') await window.refreshProblemCalculatedFields(false);
            }
            else setDirty(true);
            if (typeof window.updateConditionalSections === 'function') window.updateConditionalSections();
        } catch(e) {
            alert('Could not load default values: ' + e.message);
        }
    }

    function hideCloseSessionModal() {
        document.getElementById('close-session-modal').classList.add('hidden');
    }

    function showCloseSessionModal() {
        document.getElementById('close-session-modal').classList.remove('hidden');
    }

    function clearModelSession() {
        [problemStorageKey(), geomStorageKey(), geometricStandardsStorageKey(), parameterUnitsStorageKey(), resultUnitsStorageKey(), currentProjectKey(), currentUserProjectIdKey(), currentUserProjectNameKey(), dirtyKey(), originKey(), problemClearedKey(), lastSavedProblemKey(), lastSavedGeomKey(), lastSavedGeometricStandardsKey(), lastSavedParameterUnitsKey(), lastSavedResultUnitsKey(), lastSavedProjectKey(), lastSavedUserProjectIdKey(), lastSavedUserProjectNameKey(), lastSavedOriginKey(), lastSavedProblemClearedKey(), lastOptimizationSignatureKey(), lastOptimizationResultKey(), lastOptimizationSessionDataKey(), optimizationDirtyKey()].forEach(function(key) {
            sessionStorage.removeItem(key);
        });
        [modelKey('project_temporal_local'), modelKey('project_saved_local'), modelKey('last_saved_temporal_local')].forEach(function(key) {
            sessionStorage.removeItem(key);
        });
    }

    async function finishCloseSession() {
        clearModelSession();
        await fetch('/api/auth/logout', {method: 'POST', credentials: 'include'});
        window.location.href = '/ui/login.html';
    }

    function logout() {
        if (!syncCurrentPageState()) return;
        if (isDirty()) showCloseSessionModal();
        else finishCloseSession();
    }

    function logoutWithoutSave() {
        hideCloseSessionModal();
        finishCloseSession();
    }

    async function closeAfterSaveCloud() {
        if (await saveCloud()) finishCloseSession();
    }

    async function closeAfterSaveAsCloud() {
        if (await saveAsCloud()) finishCloseSession();
    }

    document.querySelectorAll('.checkbox-item').forEach(function(el) {
        el.addEventListener('click', function() {
            if (this.dataset.static === 'true') return;
            this.classList.toggle('checked');
            var icon = this.querySelector('i');
            if (icon) icon.classList.toggle('fa-check');
            setDirty(true);
        });
    });
    requireAuth();
    document.addEventListener('DOMContentLoaded', function() {
        updateProjectIndicator();
    });
    </script>
</body>
</html>
