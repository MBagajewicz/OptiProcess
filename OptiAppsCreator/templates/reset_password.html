<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OptiHexx — Reset Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f4f7fa] min-h-screen flex items-center justify-center font-sans">
    <div class="bg-white border border-gray-200 rounded-2xl shadow-xl p-6 w-[360px]">
        <h1 class="text-xl font-bold text-gray-800 text-center mb-2">Update Password</h1>
        <p id="token-status" class="text-xs text-center text-gray-500 mb-4">Validating link...</p>
        <div class="space-y-4">
            <input id="new-password" type="password" placeholder="New password" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
            <input id="confirm-password" type="password" placeholder="Confirm password" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
            <button onclick="resetPassword()" class="w-full bg-blue-600 text-white rounded-full py-2 text-sm font-bold hover:bg-blue-700">Update Password</button>
            <a href="/ui/login.html" class="block text-center text-xs text-blue-600 underline">Back to login</a>
        </div>
        <div id="reset-message" class="mt-4 text-xs text-center font-semibold"></div>
    </div>

    <script>
    const token = new URLSearchParams(window.location.search).get('token') || '';

    function setMessage(message, isError) {
        const box = document.getElementById('reset-message');
        box.textContent = message;
        box.className = 'mt-4 text-xs text-center font-semibold ' + (isError ? 'text-red-600' : 'text-green-700');
    }

    async function validateToken() {
        if (!token) {
            document.getElementById('token-status').textContent = 'Missing token.';
            return;
        }
        try {
            const response = await fetch('/api/auth/validate-reset-token?token=' + encodeURIComponent(token));
            const data = await response.json();
            if (!response.ok) throw new Error(data.detail || 'Invalid link');
            document.getElementById('token-status').textContent = 'Updating password for ' + data.username;
        } catch(e) {
            document.getElementById('token-status').textContent = e.message;
            document.getElementById('token-status').className = 'text-xs text-center text-red-600 mb-4';
        }
    }

    async function resetPassword() {
        try {
            const response = await fetch('/api/auth/reset-password', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    token: token,
                    new_password: document.getElementById('new-password').value,
                    confirm_password: document.getElementById('confirm-password').value
                })
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.detail || 'Could not update password');
            setMessage('Password updated. You can now log in.', false);
        } catch(e) {
            setMessage(e.message, true);
        }
    }

    validateToken();
    </script>
</body>
</html>
