<section id="model-context-panel" class="min-w-0 overflow-hidden rounded-md border border-slate-300 bg-white text-[10px] leading-[1.1] text-slate-700 shadow-sm">
    <div class="divide-y divide-slate-100">
        <div class="flex items-baseline justify-between gap-1.5 px-2 py-1 text-left">
            <span class="shrink-0 text-[8px] font-bold uppercase tracking-wide text-slate-400">Model</span>
            <strong id="context-model" class="min-w-0 truncate text-right font-semibold text-slate-800">{{ model_name }}</strong>
        </div>
        <div class="flex items-baseline justify-between gap-1.5 px-2 py-1 text-left">
            <span class="shrink-0 text-[8px] font-bold uppercase tracking-wide text-slate-400">Project</span>
            <strong id="context-project" class="min-w-0 truncate text-right font-semibold text-slate-800">No User Project</strong>
        </div>
        <div class="flex items-baseline justify-between gap-1.5 px-2 py-1 text-left">
            <span class="shrink-0 text-[8px] font-bold uppercase tracking-wide text-slate-400">Design</span>
            <strong id="context-design" class="min-w-0 truncate text-right font-semibold text-slate-800">Unsaved Design</strong>
        </div>
        <div class="flex items-center justify-between gap-1.5 px-2 py-1 text-left">
            <span class="shrink-0 text-[8px] font-bold uppercase tracking-wide text-slate-400">Calculation Status</span>
            <strong id="context-calculation-status" class="inline-block rounded-full bg-slate-100 px-1 py-0.5 text-[8px] font-semibold text-slate-600">Not calculated</strong>
        </div>
    </div>
    <div class="border-t border-slate-300 bg-slate-50 px-2 py-1.5">
        <h2 class="mb-1 text-[9px] font-bold text-slate-700"><i class="fas fa-sliders-h mr-1 text-indigo-500"></i>Model Configuration</h2>
        <div id="model-configuration-summary-content">
            <div class="text-[9px] text-slate-400">Loading configuration...</div>
        </div>
    </div>
</section>
