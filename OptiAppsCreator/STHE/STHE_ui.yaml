# STHE_ui.yaml — UI presentation metadata for Shell & Tube Heat Exchanger
# Model-specific pages (problem_data, geometric_options, results).
# Common metadata (header, available_models, login) lives in common_ui.yaml .

model:
  display_name: "Shell & Tube"
  icon: "fa-industry"
  sync_scalar_keys:
    - LBLD
    - UBLD

pages:
  # ============================================================
  # PROBLEM DATA PAGE
  # ============================================================
  problem_data:
    title: "Problem Data"
    default_buttons: true
    columns:
      # Column layout: list of sections per column, left to right
      - [optimization_target, fluid_allocation]
      - [hot_stream, cold_stream, lmtd_display]
      - [flow_limits, lmtd_settings, other_options, bell_params]
      - [economic]

    sections:

      optimization_target:
        title: "OPTIMIZATION TARGET"
        element: radio_group
        source: "Model_Declarations"
        source_key: "Selected_OF"
        options:
          - {value: "TAC_OF", label: "TAC"}
          - {value: "CAPEX_OF", label: "CAPEX"}
          - {value: "AREA_OF", label: "AREA"}

      fluid_allocation:
        title: "FLUID ALLOCATION"
        element: radio_group
        source: "Model_Parameters"
        source_key: "yfluid"
        options:
          - {value: "", label: "Autoselect allocation"}
          - {value: "cold_stream", label: "Cold in Tubes"}
          - {value: "hot_stream", label: "Hot in Tubes"}

      hot_stream:
        title: "HOT STREAM"
        element: form_group
        color: red
        source: "Model_Parameters"
        fields:
          Thi:      {label: "Inlet Temperature", unit: "°C"}
          Tho:      {label: "Outlet Temperature", unit: "°C"}
          mh:       {label: "Flow Rate", unit: "kg/s"}
          roh:      {label: "Density", unit: "kg/m³"}
          Cph:      {label: "Heat Capacity", unit: "J/(kg K)"}
          mih:      {label: "Viscosity", unit: "Pa s"}
          kh:       {label: "Thermal Cond.", unit: "W/(m K)"}
          Rfh:      {label: "Fouling Factor", unit: "m² °C/W"}
          DPhdisp:  {label: "Available Pressure Drop", unit: "Pa"}

      cold_stream:
        title: "COLD STREAM"
        element: form_group
        color: blue
        source: "Model_Parameters"
        fields:
          Tci:      {label: "Inlet Temperature", unit: "°C"}
          Tco:      {label: "Outlet Temperature", unit: "°C", computed_hint: true}
          mc:       {label: "Flow Rate", unit: "kg/s"}
          roc:      {label: "Density", unit: "kg/m³"}
          Cpc:      {label: "Heat Capacity", unit: "J/(kg K)"}
          mic:      {label: "Viscosity", unit: "Pa s"}
          kc:       {label: "Thermal Cond.", unit: "W/(m K)"}
          Rfc:      {label: "Fouling Factor", unit: "m² °C/W"}
          DPcdisp:  {label: "Available Pressure Drop", unit: "Pa"}

      lmtd_display:
        title: ""
        element: computed_display
        color: pink
        rows:
          - {label: "LMTD (Calculated)", key: "LMTD", unit: "°C", computed: true}

      flow_limits:
        title: "FLOW LIMITS"
        element: limit_table
        color: red
        source: "Model_Parameters"
        rows:
          - {item: "Tube velocity", unit: "m/s", lower: vtmin, upper: vtmax}
          - {item: "Shell velocity", unit: "m/s", lower: vsmin, upper: vsmax}
          - {item: "Tube Reynolds", lower: Retmin, upper: Retmax}
          - {item: "Shell Reynolds", lower: Resmin, upper: Resmax}
          - {item: "L/D ratio", lower: LBLD, upper: UBLD}

      lmtd_settings:
        title: "LMTD CORRECTION FACTOR SETTINGS"
        element: form_group
        color: yellow
        source: "Model_Parameters"
        fields:
          Xp:    {label: "Xp limit (Pmax*Xp < P)"}
          F_min: {label: "F min value"}

      other_options:
        title: "OTHER OPTIONS"
        element: form_group
        color: gray
        source: "Model_Parameters"
        fields:
          Aexc:          {label: "Excess Area", unit: "%"}
          eta:           {label: "Pump Efficiency"}
          Shell_Method:  {label: "Shell Method", element: select, options: ["Kern", "Bell"]}
          Tube_Method:   {label: "Tube Method", element: select, options: ["Dittus_Boelter", "Dewiit_Saunders", "Gnielinski", "Hausen", "Sieder_Tate"]}

      bell_params:
        title: "BELL METHOD PARAMETERS"
        element: form_group
        default_button: true
        color: gray
        source: "Model_Parameters"
        visible_when:
          key: Shell_Method
          equals: "Bell"
        fields:
          Nss:     {label: "Number of sealing strips", default: 0}
          plbmax1: {label: "Max unsupported span (type 1)", default: 52}
          plbmax2: {label: "Max unsupported span (type 2)", default: 0.532}

      economic:
        title: "ECONOMIC PARAMETERS"
        element: form_group
        color: green
        source: "Model_Parameters"
        fields:
          n:        {label: "Amortization period", unit: "years"}
          pc:       {label: "Energy cost", unit: "$/kWh"}
          Nop:      {label: "Operating hours per year", unit: "h/year"}
          int_rate: {label: "Interest", unit: "%", display_factor: 100}
          par_a:    {label: "Cost model parameter a"}
          par_b:    {label: "Cost model exponent b"}

  # ============================================================
  # GEOMETRIC OPTIONS PAGE
  # ============================================================
  geometric_options:
    title: "Geometric Options"
    default_buttons: false
    columns:
      - [configurations, shell_count]
      - [tube_passes, layouts, pitch_ratio]
      - [shell_diameter]
      - [tube_diameter, tube_length]
      - [baffle_cut, tube_options]
      - [baffle_count]

    sections:
      # 'configurations' and 'shell_counts' are pre-visualizations of future geometric options
      # Instead are declared with 'static=true' 
      configurations:
        title: "Configurations Available"
        element: checkbox_grid
        color: brown
        static: true
        items:
          - {value: "Series"}
          - {value: "Parallel"}
          - {value: "Hot series cold parallel"}
          - {value: "Cold series hot parallel"}

      shell_count:
        title: "Number of Shells Available"
        element: checkbox_grid
        color: brown
        static: true
        items:
          - {value: 1}
          - {value: 2}
          - {value: 3}
          - {value: 4}
          - {value: 5}
          - {value: 6}
          - {value: 7}
          - {value: 8}
      
      # Next are the implemented model options
      tube_passes:
        title: "Number of Tube Passes"
        element: checkbox_grid
        color: blue
        variable: "Npt"                        # index in List_of_Variables

      layouts:
        title: "Layouts Available"
        element: checkbox_grid
        color: blue
        variable: "lay"
        value_labels: {1: "Square (90°)", 2: "Triangle (30°)", 3: "Rotated Square (45°)"}

      pitch_ratio:
        title: "Pitch Ratio"
        element: checkbox_grid
        color: blue
        variable: "rp"

      shell_diameter:
        title: "Shell Diameter"
        unit: "m"
        element: checkbox_grid
        color: yellow
        variable: "Ds"

      tube_diameter:
        title: "Outer Tube Diameter"
        unit: "m"
        element: checkbox_grid
        color: brown_dark
        variable: "dte"

      tube_length:
        title: "Tube Length"
        unit: "m"
        element: checkbox_grid
        color: red_dark
        variable: "L"

      baffle_cut:
        title: "Baffle cut"
        element: checkbox_grid
        color: green
        variable: "Bc"

      baffle_count:
        title: "Number of Baffles"
        element: checkbox_grid
        color: green
        variable: "Nb"

      tube_options:
        title: "Tube Options"
        element: form_group
        default_button: true
        color: brown_dark
        source: "Model_Parameters"
        fields:
          LBLD:   {label: "Minimum Tube Length", unit: "m"}
          UBLD:   {label: "Maximum Tube Length", unit: "m"}
          ktube:  {label: "Thermal Conductivity", unit: "W/(m K)"}
          thk:    {label: "Tube Thickness", unit: "m"}

  # ============================================================
  # RESULTS PAGE
  # ============================================================
  results:
    title: "Results"
    columns:
      - [hot_stream_results, cold_stream_results, summary_data]
      - [unit_geometry]
      - [thermo_properties, pressure_drop]
      - [optimization_results]

    sections:

      hot_stream_results:
        title: "HOT STREAM"
        element: data_table
        color: green_display
        source: "Model_Parameters"
        source_prefix: "h"
        rows:
          - {label: "Mass flow rate", key: "mh", unit: "kg/s"}
          - {label: "Inlet temperature", key: "Thi", unit: "°C"}
          - {label: "Outlet temperature", key: "Tho", unit: "°C"}
          - {label: "Density", key: "roh", unit: "kg/m³"}
          - {label: "Viscosity", key: "mih", unit: "Pa s", display_factor: 1000, display_unit: "mPa s"}
          - {label: "Heat capacity", key: "Cph", unit: "J/(kg K)"}
          - {label: "Thermal cond.", key: "kh", unit: "W/(m K)"}
          - {label: "Fouling factor", key: "Rfh", unit: "m² K/W"}

      cold_stream_results:
        title: "COLD STREAM"
        element: data_table
        color: green_display
        source: "Model_Parameters"
        source_prefix: "c"
        rows:
          - {label: "Mass flow rate", key: "mc", unit: "kg/s"}
          - {label: "Inlet temperature", key: "Tci", unit: "°C"}
          - {label: "Outlet temperature", key: "Tco", unit: "°C"}
          - {label: "Density", key: "roc", unit: "kg/m³"}
          - {label: "Viscosity", key: "mic", unit: "Pa s", display_factor: 1000, display_unit: "mPa s"}
          - {label: "Heat capacity", key: "Cpc", unit: "J/(kg K)"}
          - {label: "Thermal cond.", key: "kc", unit: "W/(m K)"}
          - {label: "Fouling factor", key: "Rfc", unit: "m² K/W"}

      summary_data:
        title: ""
        element: data_table
        color: green_display
        rows:
          - {label: "Heat load", key: "Q", unit: "kW", computed: true}
          - {label: "LMTD", key: "LMTD", unit: "°C", computed: true}

      unit_geometry:
        title: "UNIT GEOMETRY"
        element: data_table
        color: blue_display
        rows:
          - {label: "Shell diameter", key: "Ds", unit: "m", result_var: true}
          - {label: "Number of baffles", key: "Nb", result_var: true}
          - {label: "Baffle cut", key: "Bc", result_var: true}
          - {label: "Number of tubes", key: "Nt", computed: true}
          - {label: "Number tube passes", key: "Npt", result_var: true}
          - {label: "Outer tube diam.", key: "dte", unit: "m", result_var: true}
          - {label: "Tube bundle layout", key: "layout", result_var: true}
          - {label: "Pitch ratio", key: "rp", result_var: true}
          - {label: "Tube length", key: "L", unit: "m", result_var: true}
          - {label: "Heat transfer area per shell", key: "A_shell", unit: "m²", computed: true}
          - {label: "Total heat transfer area", key: "A_total", unit: "m²", computed: true}
          - {label: "Correction factor", key: "F", computed: true}
          - {label: "Area/required area ratio", key: "A_ratio", computed: true}

      thermo_properties:
        title: "THERMO PROPERTIES"
        element: data_table
        color: yellow_display
        subsections:
          - title: "TUBE SIDE"
            rows:
              - {label: "Velocity flow", key: "vt", unit: "m/s", computed: true}
              - {label: "Reynolds number", key: "Ret", computed: true}
              - {label: "Conv. heat transfer coeff.", key: "ht", unit: "W/(m² K)", computed: true}
          - title: "SHELL SIDE"
            rows:
              - {label: "Velocity flow", key: "vs", unit: "m/s", computed: true}
              - {label: "Reynolds number", key: "Res", computed: true}
              - {label: "Conv. heat transfer coeff.", key: "hs", unit: "W/(m² K)", computed: true}
        footer_rows:
          - {label: "Overall heat transfer coeff. (dirty)", key: "U", unit: "W/(m² K)", computed: true}
          - {label: "Overall heat transfer coeff. (clean)", key: "Uc", unit: "W/(m² K)", computed: true}

      pressure_drop:
        title: "PRESSURE DROP"
        element: data_table
        color: red_display
        rows:
          - {label: "Tube pressure drop", key: "DPt", unit: "kPa", computed: true}
          - {label: "Shell pressure drop", key: "DPs", unit: "kPa", computed: true}

      optimization_results:
        title: "OPTIMIZATION"
        element: data_table
        color: blue_display
        subsections:
          - title: ""
            rows:
              - {label: "Objective function", key: "OF_value", unit_from: "OF", computed: true, highlight: true}
          - title: "ECONOMICS"
            rows:
              - {label: "Capital cost", key: "CAPEX", unit: "$", computed: true}
              - {label: "Tube side operational cost", key: "OPEX_t", unit: "$/y", computed: true}
              - {label: "Shell side operational cost", key: "OPEX_s", unit: "$/y", computed: true}
              - {label: "Operational cost", key: "OPEX_total", unit: "$/y", computed: true}
              - {label: "Total annualized cost", key: "TAC", unit: "$/y", computed: true}
