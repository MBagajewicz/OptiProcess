services:
  app:
    image: "${DOCKERHUB_IMAGE:?Set DOCKERHUB_IMAGE in .env}:${IMAGE_TAG:?Set IMAGE_TAG in .env}"
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:10000:8000"
    environment:
      AUTH_DB_PATH: /data/users.db
      SESSION_COOKIE_NAME: "${SESSION_COOKIE_NAME:-optihex_session}"
      SESSION_HOURS: "${SESSION_HOURS:-8}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-true}"
      USERS_IMPORT_FILE: /deployment/users_import.xlsx
    volumes:
      - optiprocess_data:/data
      - type: bind
        source: .
        target: /deployment
        read_only: true
    tmpfs:
      - /tmp/opencode:mode=1777,size=1g
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  optiprocess_data:
    name: "${DATA_VOLUME_NAME:-optiprocess_data}"
